github:
  description: "Apache Maven Jarsigner"
  homepage: https://maven.apache.org/shared/maven-jarsigner/
  labels:
    - java
    - build-management
    - maven-shared
    - maven
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  autolink_jira:
    - MSHARED
  del_branch_on_merge: true
  features:
    issues: true
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org
  jira_options: link label comment
# https://releases.apache.org/projects/maven-jarsigner
project:
  metadata:
    key: maven-jarsigner
    committee: maven
    name: Apache Maven Jarsigner
    description: A component to assist in signing jars.
    homepage: https://maven.apache.org/shared/maven-jarsigner/
    download_page: https://maven.apache.org/shared/maven-jarsigner/download.cgi
    bug_database: https://maven.apache.org/shared/maven-jarsigner/issue-management.html
    mailing_lists: https://maven.apache.org/shared/maven-jarsigner/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-jarsigner
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-jarsigner
    download_path_suffix: shared
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
